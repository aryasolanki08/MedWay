<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedWay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>%F0%9F%92%8A</text></svg>" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

    :root {
      --brand-400: #34d399;
      --brand-500: #22c55e;
      --brand-700: #047857;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #020617; --surface: #0f172a; --text: #f1f5f9; --muted: #94a3b8; --border: #1e293b; }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .brand-mark {
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, var(--brand-400), var(--brand-700));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 12px 28px -10px rgba(34, 197, 94, 0.55);
      margin-bottom: 1.25rem;
    }
    p { color: var(--muted); font-size: 0.95rem; margin: 0.35rem 0 1.5rem; }
    a.continue {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--brand-500);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 0.9rem;
      text-decoration: none;
      box-shadow: 0 12px 28px -10px rgba(34, 197, 94, 0.55);
    }
  </style>
</head>
<body>
  <div class="brand-mark">💊</div>
  <p id="status">Taking you to MedWay&hellip;</p>
  <a class="continue" id="continue-link" href="#">Continue to MedWay</a>

  <script>
    // Zero-build redirect shim: the project's single entry point always
    // opens the scroll-driven MedWay landing (frontend's /welcome), which
    // is itself the chooser between the customer and pharmacy portals --
    // see components/welcome/CTASection.jsx. Portal URLs default to the
    // local dev ports and can be overridden (and are forwarded through)
    // via ?customer=<url>&pharmacy=<url> so the same static file works
    // once each app is deployed to a real domain.
    const params = new URLSearchParams(window.location.search);
    const customerUrl = params.get("customer") || "http://localhost:5173";

    const target = new URL(customerUrl.replace(/\/$/, "") + "/welcome");
    const pharmacyOverride = params.get("pharmacy");
    if (pharmacyOverride) target.searchParams.set("pharmacy", pharmacyOverride);

    document.getElementById("continue-link").href = target.toString();
    window.location.replace(target.toString());
  </script>
</body>
</html>
